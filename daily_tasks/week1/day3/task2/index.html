<!DOCTYPE html>
<html lang="en">
<head>

    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/400?random=5" alt="Gallery photo 5">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/600/400?random=6" alt="Gallery photo 6">

  <footer>
    <p>&copy; 2026 Photo Gallery</p>
  </footer>

</body>
</html>
